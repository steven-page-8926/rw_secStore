[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/crypto",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["RapidWebs Engineering"]
description = "Minimal, enterprise-grade secure keystore and certificate authority"

# Workspace lints - applied to all crates
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
must_use_candidate = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.dependencies]
# Workspace dependencies (members reference these via `crate.workspace = true`)
# Sorted alphabetically for consistency

# Core utilities
anyhow = { version = "1", features = ["std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "string"] }
clap_mangen = "0.2"
directories = "5"
hex = "0.4"
indicatif = "0.17"
qrcode = "0.14"
rand = "0.8"
# (reqwest is declared per-crate, not as workspace dep, due to optionality)
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# Crypto (pure Rust)
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
zxcvbn = "3"

# SSH
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa"] }

# X.509
rcgen = "0.13"
x509-parser = "0.16"
der-parser = "9"
asn1-rs = "0.7"
pem = "3"
pkcs12 = "0.6"

# OS Keyring
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }

# Dev dependencies
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = "1"

# Profile: optimized release for security-critical paths
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
incremental = false

# Profile: dev with debug info
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Profile: bench for reproducible benchmarks
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
