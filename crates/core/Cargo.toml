[package]
name = "rw-secstore-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Domain logic (auth, keystore, CA, audit) for rw-secstore"

[lints]
workspace = true

[features]
# Enable OS keyring integration (requires libdbus-1-dev on Linux)
default = []
keyring = ["dep:keyring"]

[dependencies]
rw-secstore-crypto = { path = "../crypto" }
rw-secstore-storage = { path = "../storage" }

anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
hex = { workspace = true }
keyring = { workspace = true, optional = true }
rand = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
zxcvbn = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
